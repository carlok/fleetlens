name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check .
      - name: Tests
        run: python -m coverage run -m pytest
      - name: Coverage
        run: python -m coverage report
      - name: Ansible syntax
        run: |
          export ANSIBLE_CONFIG=ansible/ansible.cfg
          export ANSIBLE_HOME=.ansible
          export ANSIBLE_LOCAL_TEMP=.ansible/tmp
          mkdir -p .ansible/tmp
          ansible-playbook --syntax-check -i ansible/inventories/example/hosts.ini ansible/playbooks/ping.yml
          ansible-playbook --syntax-check -i ansible/inventories/example/hosts.ini ansible/playbooks/collect.yml
      - name: ansible-lint
        run: ansible-lint ansible/playbooks ansible/roles
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Containerfile
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"
