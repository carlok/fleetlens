name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      ANSIBLE_CONFIG: ansible/ansible.cfg
      ANSIBLE_HOME: .ansible
      ANSIBLE_LOCAL_TEMP: .ansible/tmp
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group dev --locked
      - name: Ruff
        run: uv run ruff check .
      - name: Tests
        run: uv run coverage run -m pytest
      - name: Coverage
        run: uv run coverage report
      - name: Ansible syntax
        run: |
          mkdir -p .ansible/tmp
          uv run ansible-playbook --syntax-check -i ansible/inventories/example/hosts.ini ansible/playbooks/ping.yml
          uv run ansible-playbook --syntax-check -i ansible/inventories/example/hosts.ini ansible/playbooks/collect.yml
      - name: ansible-lint
        run: uv run ansible-lint ansible/playbooks ansible/roles

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x scripts/*.sh

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true
