---
- name: Collect FleetLens VM health data
  hosts: vms
  gather_facts: true
  ignore_unreachable: true
  roles:
    - role: vm_healthcheck

- name: Write FleetLens raw report
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    fleetlens_raw_report_path: "{{ lookup('env', 'FLEETLENS_RAW_REPORT') | default('reports/raw-ansible.json', true) }}"
    fleetlens_raw_report_abs: >-
      {{
        fleetlens_raw_report_path
        if fleetlens_raw_report_path.startswith('/')
        else (playbook_dir ~ '/../..' ~ '/' ~ fleetlens_raw_report_path)
      }}
    fleetlens_target_hosts: >-
      {{ groups.get('vms', []) | intersect(query('inventory_hostnames', ansible_limit | default('all'))) }}
  tasks:
    # A host whose collection aborted early sets no result; report it instead of dropping it.
    - name: Collect host results
      ansible.builtin.set_fact:
        fleetlens_hosts: >-
          {{
            fleetlens_hosts | default([])
            + [hostvars[item].vm_healthcheck_result
               if hostvars[item].vm_healthcheck_result is defined
               else {'host': item, 'reachable': false, 'errors': ['no result collected']}]
          }}
      loop: "{{ fleetlens_target_hosts }}"

    - name: Ensure report directory exists
      ansible.builtin.file:
        path: "{{ fleetlens_raw_report_abs | dirname }}"
        state: directory
        mode: "0755"

    - name: Write raw JSON report
      ansible.builtin.copy:
        dest: "{{ fleetlens_raw_report_abs }}"
        mode: "0644"
        content: "{{ {'hosts': fleetlens_hosts | default([])} | to_nice_json }}\n"
