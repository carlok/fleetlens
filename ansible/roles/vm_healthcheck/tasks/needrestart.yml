---
- name: Check needrestart availability
  ansible.builtin.command: command -v needrestart
  register: vm_healthcheck_needrestart_path
  changed_when: false
  failed_when: false

- name: Run needrestart when available
  ansible.builtin.command: needrestart -b
  register: vm_healthcheck_needrestart_run
  changed_when: false
  failed_when: false
  when: vm_healthcheck_needrestart_path.rc == 0

- name: Check checkrestart availability
  ansible.builtin.command: command -v checkrestart
  register: vm_healthcheck_checkrestart_path
  changed_when: false
  failed_when: false
  when: vm_healthcheck_checkrestart_enabled | bool

- name: Run checkrestart when available
  ansible.builtin.command: checkrestart
  register: vm_healthcheck_checkrestart_run
  changed_when: false
  failed_when: false
  when:
    - vm_healthcheck_checkrestart_enabled | bool
    - vm_healthcheck_checkrestart_path.rc == 0

- name: Store restart checker facts
  ansible.builtin.set_fact:
    vm_healthcheck_needrestart:
      needrestart_installed: "{{ vm_healthcheck_needrestart_path.rc == 0 }}"
      needrestart_output: "{{ vm_healthcheck_needrestart_run.stdout | default('') }}"
      checkrestart_installed: "{{ (vm_healthcheck_checkrestart_path.rc | default(1)) == 0 }}"
      checkrestart_output: "{{ vm_healthcheck_checkrestart_run.stdout | default('') }}"
