[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetlens"
version = "0.2.0"
description = "Agentless, read-only health reports for small Debian/Ubuntu VM fleets, using Ansible over SSH."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Carlo Perassi" }]
keywords = ["ansible", "healthcheck", "monitoring", "ssh", "debian", "ubuntu", "apt", "sre"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "ansible-core>=2.19,<2.22",
]

[dependency-groups]
dev = [
  "ansible-lint>=24",
  "coverage>=7",
  "pytest>=8",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/carlok/fleetlens"
Issues = "https://github.com/carlok/fleetlens/issues"
Changelog = "https://github.com/carlok/fleetlens/blob/main/CHANGELOG.md"

[project.scripts]
fleetlens = "fleetlens.cli:main"

[project.optional-dependencies]
runner = ["ansible-runner>=2.4"]
notify = ["apprise>=1.8"]

[tool.setuptools]
packages = ["fleetlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["fleetlens"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
