[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetlens"
version = "0.1.0"
description = "Agentless VM health reports with Ansible, Python, local SSH, and email."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ansible-core>=2.19,<2.22",
]

[dependency-groups]
dev = [
  "ansible-lint>=24",
  "coverage>=7",
  "pytest>=8",
  "ruff>=0.5",
]

[project.optional-dependencies]
runner = ["ansible-runner>=2.4"]
notify = ["apprise>=1.8"]

[tool.setuptools]
packages = ["fleetlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["fleetlens"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
